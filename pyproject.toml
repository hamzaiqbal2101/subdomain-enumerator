[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subdomain-enumerator"
version = "1.0.0"
description = "Production-style subdomain enumeration: wordlist brute-force, certificate-transparency OSINT, wildcard filtering, and CNAME takeover detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hamza Iqbal" }]
dependencies = [
    "dnspython>=2.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
subdomain-enumerator = "subdomain_enumerator.cli:main"

[tool.setuptools]
packages = ["subdomain_enumerator"]

[tool.setuptools.package-data]
subdomain_enumerator = ["data/*.txt"]